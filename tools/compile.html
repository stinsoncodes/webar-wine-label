<meta charset="utf-8">
<title>MindAR batch compile</title>
<!-- NB: mindar-image.prod.js (unlike the -aframe build) ships as an ES module.
     A classic <script src> tag loads nothing and leaves window.MINDAR undefined,
     so it is imported from the module script at the bottom instead. -->
<style>
  body { font: 13px/1.5 ui-monospace, monospace; background: #111; color: #ddd; padding: 18px; }
  #log { white-space: pre-wrap; }
  .ok { color: #5f5; } .bad { color: #f77; } .dim { color: #888; }
</style>

<div id="log">starting…</div>

<script type="module">
import 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js'

// One .mind per id, never a combined multi-target file. The personalised labels share
// a byte-identical cream upper half, so roughly half of every target's features
// are common to all thirteen — harmless when only one is ever loaded, but in a
// combined file they would cross-match constantly.
const IDS = ['jacqui', 'james', 'seth', 'kyle', 'scot', 'julie', 'bo',
             'dan', 'jayshree', 'jeff', 'karl', 'duke', 'loren']

const logEl = document.getElementById('log')
const say = (m, cls) => {
  logEl.innerHTML += '\n' + (cls ? `<span class="${cls}">${m}</span>` : m)
  console.log(m)
}

window.__progress = { done: [], failed: [], current: null, stats: {} }

const loadImage = src => new Promise((res, rej) => {
  const i = new Image()
  i.onload = () => res(i)
  i.onerror = () => rej(new Error('could not load ' + src))
  i.src = src
})

;(async () => {
  for (const id of IDS) {
    window.__progress.current = id
    try {
      const img = await loadImage(`./sources/${id}.png`)
      // A fresh Compiler per target: reusing one across targets risks carrying
      // state between them.
      const compiler = new window.MINDAR.IMAGE.Compiler()
      const t0 = performance.now()
      const dataList = await compiler.compileImageTargets([img], () => {})
      const d = dataList[0]
      const matching = d.matchingData.reduce(
        (n, m) => n + m.maximaPoints.length + m.minimaPoints.length, 0)
      const tracking = d.trackingData.map(s => s.points.length)
      const buffer = await compiler.exportData()
      const r = await fetch('/save/' + id, { method: 'POST', body: buffer })
      if (!r.ok) throw new Error('save failed: ' + r.status)
      const secs = ((performance.now() - t0) / 1000).toFixed(0)
      window.__progress.stats[id] = { matching, tracking, bytes: buffer.byteLength }
      window.__progress.done.push(id)
      say(`${id.padEnd(9)} ${String(matching).padStart(5)} matching  ` +
          `tracking [${tracking.join(', ')}]  ${(buffer.byteLength/1024).toFixed(0)}KB  ${secs}s`,
          matching >= 1500 ? 'ok' : 'bad')
    } catch (e) {
      window.__progress.failed.push(id)
      say(`${id.padEnd(9)} FAILED: ${e.message}`, 'bad')
    }
  }
  window.__progress.current = null
  window.__done = true
  say(`\ndone: ${window.__progress.done.length} ok, ${window.__progress.failed.length} failed`,
      window.__progress.failed.length ? 'bad' : 'ok')
})()
</script>
